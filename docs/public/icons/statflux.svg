<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="48" height="48" shape-rendering="crispEdges" aria-hidden="true">
  <!-- rising pixel bars: crimson base, orange body -->
  <rect x="1" y="11" width="3" height="4" fill="#E65A15"/>
  <rect x="5" y="8" width="3" height="7" fill="#E65A15"/>
  <rect x="9" y="5" width="3" height="10" fill="#E65A15"/>
  <rect x="1" y="14" width="11" height="1" fill="#A21917"/>
  <!-- pixels breaking off the top bar -->
  <rect x="13" y="3" width="2" height="2" fill="#E65A15"/>
  <rect x="13" y="0" width="1" height="1" fill="#A21917"/>
  <rect x="15" y="1" width="1" height="1" fill="#E65A15"/>
  <rect x="11" y="2" width="1" height="1" fill="#A21917"/>
</svg>
